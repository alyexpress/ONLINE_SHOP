{% extends "shop/base.html" %}

{% set shop_nav = 3 %}
{% set css = ["shop-form.css"] %}

{% block shop_body %}
    <form action="" method="post" enctype=multipart/form-data>
        <h1>Добавление товара:</h1>
        <div class="mt-4 mb-3">
            <label class="form-label">Название товара</label>
            <input type="text" class="form-control form-control-lg" name="name" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Описание товара</label>
            <textarea class="form-control form-control-lg" rows="3" name="description"></textarea>
        </div>
        <div class="mb-4">
            <label class="form-label">Картинка товара</label>
            <input type="file" accept="image/*" class="form-control form-control-lg" name="cover" required>
        </div>
        <div class="mb-3 d-flex">
            <div style="margin-right: 15px">
                <label class="form-label">Цена товара</label>
                <div class="input-group">
                    <input type="number" class="form-control form-control-lg" name="price" required>
                    <span class="input-group-text">₽</span>
                </div>
            </div>
            <div>
                <label class="form-label">Цена со скидкой</label>
                <div class="input-group">
                    <input type="number" class="form-control form-control-lg" placeholder="* необязательно" name="discount_price">
                    <span class="input-group-text">₽</span>
                </div>
            </div>
        </div>
        <div class="mb-3 d-flex">
            <div style="margin-right: 15px; flex-grow: 1">
                <label class="form-label">Количество товара</label>
                <input type="number" class="form-control form-control-lg" name="count">
            </div>
            <div class="flex-grow-1 d-flex align-items-end">
                <button type="submit" class="btn btn-lg btn-primary w-100">Добавить товар</button>
            </div>
        </div>
    </form>
{% endblock %}
