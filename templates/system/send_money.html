<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{ PROJECT_NAME }} | Пополнить баланс</title>
    <style>
        html * {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"!important;
        }
        body {
            position: relative;
            background: #F5F7FA;
        }
        form {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
        }
        form > div { display: flex }
        form > div > input {
            display: block;
            width: calc(100% - 60px);
            font-size: 25px;
            font-weight: 500;
            padding: 10px 30px;
            background: white;
            border: 1px solid #eee;
            border-right: none;
            border-radius: 20px 0 0 20px;
            outline: none;
        }
        form > div > span {
            display: flex;
            align-items: center;
            font-size: 27px;
            font-weight: bold;
            background: white;
            padding: 0 20px;
            border: 1px solid #eee;
            border-left: none;
            border-radius: 0 20px 20px 0;
        }
        form > button {
            display: block;
            width: 100%;
            font-size: 25px;
            font-weight: 500;
            padding: 10px 0;
            background: dodgerblue;
            border-radius: 20px;
            outline: none;
            border: none;
            color: white;
            margin-top: 10px;
        }
        form > .success {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 25px;
            font-weight: 500;
            padding: 10px 0;
            background: #00c451;
            border-radius: 20px;
            outline: none;
            border: none;
            color: white;
            margin-top: 10px;
        }
        form > .success > svg { margin: -10px 5px -10px 0 }
        .d-none { display: none!important; }
    </style>
</head>
<body>
    <form action="" method="POST">
        <div>
            <input type="number" name="money" placeholder="Сумма пополнения" inputmode="numeric" required>
            <span>₽</span>
        </div>
        <button type="submit" {% if sent %}class="d-none"{% endif %}>Отправить</button>
        <div class="success {% if not sent %}d-none{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-check" viewBox="0 0 16 16">
                <path d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425z"/>
            </svg>
            Успешно
        </div>
    </form>
</body>
</html>
